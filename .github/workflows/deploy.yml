name: Validate and deploy static Lumbre

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumbre-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/profiles/static/package-lock.json
      - name: Prepare isolated static workspace
        run: |
          node --test portal/scripts/static-profile.test.mjs
          node portal/scripts/prepare-static-workspace.mjs "$RUNNER_TEMP/lumbre-static"
      - run: npm ci
        working-directory: ${{ runner.temp }}/lumbre-static
      - name: Check types and recipe content
        run: |
          npm run typecheck
          npm run check:recipes
          npm test
        working-directory: ${{ runner.temp }}/lumbre-static
      - name: Audit dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
        working-directory: ${{ runner.temp }}/lumbre-static
      - run: npm run build:static
        working-directory: ${{ runner.temp }}/lumbre-static
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install browser test tools
        run: |
          python -m pip install -e ./test-framework 'pypdf>=6,<7'
          python -m playwright install --with-deps chromium
      - name: Test static portal and storage recovery
        run: |
          npm run preview:static --prefix "$RUNNER_TEMP/lumbre-static" > /tmp/lumbre-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3001/ > /dev/null
          python portal/scripts/test-static.py
          python portal/scripts/check-static-print.py
          python portal/scripts/test-storage-recovery.py
          python portal/scripts/test-recipe-blend-back.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lumbre-static
          path: ${{ runner.temp }}/lumbre-static/dist-static/
          if-no-files-found: error
  deploy-production:
    name: Deploy static production
    needs: static-build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://metodolumbre.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/profiles/static/package-lock.json
      - name: Prepare isolated static workspace
        run: node portal/scripts/prepare-static-workspace.mjs "$RUNNER_TEMP/lumbre-static"
      - run: npm ci
        working-directory: ${{ runner.temp }}/lumbre-static
      - name: Download the validated build from this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: lumbre-static
          path: ${{ runner.temp }}/lumbre-static/dist-static
      - name: Deploy assets only (no backend or D1)
        working-directory: ${{ runner.temp }}/lumbre-static
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          npx wrangler deploy --config wrangler.static.jsonc
      - name: Verify published static bundle
        working-directory: ${{ runner.temp }}/lumbre-static
        run: node scripts/verify-static-deployment.mjs https://metodolumbre.com
