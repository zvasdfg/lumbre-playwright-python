name: Validate and deploy static Lumbre

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumbre-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/profiles/static/package-lock.json
      - name: Prepare isolated static workspace
        run: |
          node --test portal/scripts/static-profile.test.mjs
          node portal/scripts/prepare-static-workspace.mjs "$RUNNER_TEMP/lumbre-static"
      - run: npm ci
        working-directory: ${{ runner.temp }}/lumbre-static
      - name: Check types and recipe content
        run: |
          npm run typecheck
          npm run check:recipes
          npm test
        working-directory: ${{ runner.temp }}/lumbre-static
      - name: Audit dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
        working-directory: ${{ runner.temp }}/lumbre-static
      - run: npm run build:static
        working-directory: ${{ runner.temp }}/lumbre-static
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lumbre-static
          path: ${{ runner.temp }}/lumbre-static/dist-static/
          if-no-files-found: error
  browser-tests:
    name: Browser and print validation
    needs: static-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: lumbre-static
          path: ${{ runner.temp }}/lumbre-static/dist-static
      - name: Install browser test tools
        timeout-minutes: 3
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 2 -r portal/profiles/browser/requirements.txt
          python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); b.close(); p.stop()"
      - name: Test static portal and storage recovery
        shell: bash
        run: |
          python -m http.server 3001 --bind 127.0.0.1 --directory "$RUNNER_TEMP/lumbre-static/dist-static" > /tmp/lumbre-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3001/ > /dev/null
          python portal/scripts/test-static.py
          python portal/scripts/check-static-print.py
          python portal/scripts/test-storage-recovery.py
          python portal/scripts/test-planner-goals.py
          python portal/scripts/test-planner-simple.py
          python portal/scripts/test-planner-fuel.py
          python portal/scripts/test-planner-kettle-fuel.py
          python portal/scripts/test-planner-weber-defaults.py
          python portal/scripts/test-recipe-blend-back.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: lumbre-browser-diagnostics
          path: |
            /tmp/lumbre-preview.log
            /tmp/lumbre-*.pdf
            /tmp/lumbre-*.png
          if-no-files-found: warn
          retention-days: 7
  deploy-production:
    name: Deploy static production
    needs: [static-build, browser-tests]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://metodolumbre.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/profiles/deploy/package-lock.json
      - name: Prepare isolated deploy workspace
        run: node portal/scripts/prepare-deploy-workspace.mjs "$RUNNER_TEMP/lumbre-deploy"
      - run: npm ci
        working-directory: ${{ runner.temp }}/lumbre-deploy
      - name: Audit deploy dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
        working-directory: ${{ runner.temp }}/lumbre-deploy
      - name: Download the validated build from this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: lumbre-static
          path: ${{ runner.temp }}/lumbre-deploy/dist-static
      - name: Deploy assets only (no backend or D1)
        working-directory: ${{ runner.temp }}/lumbre-deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          npx wrangler deploy --config wrangler.static.jsonc
      - name: Verify published static bundle
        working-directory: ${{ runner.temp }}/lumbre-deploy
        run: node scripts/verify-static-deployment.mjs https://metodolumbre.com
