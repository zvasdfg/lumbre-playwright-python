name: Validate and deploy static Lumbre

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # npm 11 was used to resolve the security override in the deploy lockfile.
  # Do not rely on the npm major bundled with setup-node's Node 22.
  NPM_VERSION: "11.17.0"

concurrency:
  group: lumbre-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/profiles/static/package-lock.json
      - name: Use the verified npm version
        run: npm install --global "npm@$NPM_VERSION" --registry=https://registry.npmjs.org
      - name: Prepare isolated static workspace
        run: |
          node --test portal/scripts/static-profile.test.mjs
          node portal/scripts/prepare-static-workspace.mjs "$RUNNER_TEMP/lumbre-static"
      - run: npm ci
        working-directory: ${{ runner.temp }}/lumbre-static
      - name: Check types and recipe content
        run: |
          npm run typecheck
          npm run check:recipes
          npm test
        working-directory: ${{ runner.temp }}/lumbre-static
      - name: Audit dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
        working-directory: ${{ runner.temp }}/lumbre-static
      - name: Validate deploy installation before browser tests
        run: |
          node portal/scripts/prepare-deploy-workspace.mjs "$RUNNER_TEMP/lumbre-deploy-preflight"
          cd "$RUNNER_TEMP/lumbre-deploy-preflight"
          npm ci
          npm ls sharp
          npm audit --audit-level=high --registry=https://registry.npmjs.org
      - run: npm run build:static
        working-directory: ${{ runner.temp }}/lumbre-static
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lumbre-static
          path: ${{ runner.temp }}/lumbre-static/dist-static/
          if-no-files-found: error
  browser-tests:
    name: Browser and print validation
    needs: static-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: lumbre-static
          path: ${{ runner.temp }}/lumbre-static/dist-static
      - name: Install browser test tools
        timeout-minutes: 3
        run: |
          python -m pip install --disable-pip-version-check --timeout 30 --retries 2 -r portal/profiles/browser/requirements.txt
          python -m pip install --disable-pip-version-check --timeout 30 --retries 2 -e ./test-framework -c portal/profiles/browser/requirements.txt
          python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(); b.close(); p.stop()"
      - name: Test static portal and storage recovery
        shell: bash
        run: |
          python -m http.server 3001 --bind 127.0.0.1 --directory "$RUNNER_TEMP/lumbre-static/dist-static" > /tmp/lumbre-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3001/ > /dev/null
          BASE_URL=http://127.0.0.1:3001 python -m pytest -c test-framework/pyproject.toml test-framework/tests/framework test-framework/projects/lumbre/tests -m 'framework_unit or (portal and not matrix)' --junitxml=/tmp/lumbre-static-ui.xml --html=/tmp/lumbre-static-ui.html --self-contained-html --output=/tmp/lumbre-ui-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: lumbre-browser-diagnostics
          path: |
            /tmp/lumbre-preview.log
            /tmp/lumbre-*.pdf
            /tmp/lumbre-*.png
            /tmp/lumbre-static-ui.xml
            /tmp/lumbre-static-ui.html
            /tmp/lumbre-ui-artifacts/
          if-no-files-found: warn
          retention-days: 7
  deploy-production:
    name: Deploy static production
    needs: [static-build, browser-tests, component-matrix, browser-compatibility]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://metodolumbre.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portal/profiles/deploy/package-lock.json
      - name: Use the verified npm version
        run: npm install --global "npm@$NPM_VERSION" --registry=https://registry.npmjs.org
      - name: Prepare isolated deploy workspace
        run: node portal/scripts/prepare-deploy-workspace.mjs "$RUNNER_TEMP/lumbre-deploy"
      - run: npm ci
        working-directory: ${{ runner.temp }}/lumbre-deploy
      - name: Audit deploy dependencies
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
        working-directory: ${{ runner.temp }}/lumbre-deploy
      - name: Download the validated build from this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: lumbre-static
          path: ${{ runner.temp }}/lumbre-deploy/dist-static
      - name: Deploy assets only (no backend or D1)
        working-directory: ${{ runner.temp }}/lumbre-deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          npx wrangler deploy --config wrangler.static.jsonc
      - name: Verify published static bundle
        working-directory: ${{ runner.temp }}/lumbre-deploy
        run: node scripts/verify-static-deployment.mjs https://metodolumbre.com
  production-ui-smoke:
    name: Verify published portal UI (read only)
    needs: deploy-production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --ipc=host
    env:
      BASE_URL: https://metodolumbre.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python -m pip install -e ./test-framework -c portal/profiles/browser/requirements.txt
      - run: python -m pytest -c test-framework/pyproject.toml test-framework/projects/lumbre/tests -m "production and smoke" --output=/tmp/lumbre-published-artifacts --junitxml=/tmp/lumbre-published.xml --html=/tmp/lumbre-published.html --self-contained-html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: published-ui-evidence
          path: |
            /tmp/lumbre-published-artifacts/
            /tmp/lumbre-published.xml
            /tmp/lumbre-published.html
          retention-days: 7
  component-matrix:
    name: Component configuration matrix
    needs: static-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [planner_matrix, ingredients_matrix, recipes_matrix, almanac_matrix]
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --ipc=host
    env:
      BASE_URL: http://127.0.0.1:3001
      COMPONENT_FILTER: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: lumbre-static
          path: /tmp/lumbre-matrix-build
      - run: python -m pip install -e ./test-framework -c portal/profiles/browser/requirements.txt
      - shell: bash
        run: |
          python -m http.server 3001 --bind 127.0.0.1 --directory /tmp/lumbre-matrix-build >/tmp/lumbre-matrix-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3001/ >/dev/null
          python -m pytest -c test-framework/pyproject.toml test-framework/projects/lumbre/tests -m "portal and matrix and $COMPONENT_FILTER" --output=/tmp/lumbre-matrix-artifacts --junitxml=/tmp/lumbre-matrix.xml --html=/tmp/lumbre-matrix.html --self-contained-html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: component-matrix-evidence-${{ matrix.component }}
          path: |
            /tmp/lumbre-matrix-artifacts/
            /tmp/lumbre-matrix.xml
            /tmp/lumbre-matrix.html
            /tmp/lumbre-matrix-server.log
          retention-days: 7
  browser-compatibility:
    name: Keyboard and recovery (${{ matrix.browser }})
    needs: static-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --ipc=host
    env:
      BASE_URL: http://127.0.0.1:3001
      TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: lumbre-static
          path: /tmp/lumbre-compat-build
      - run: python -m pip install -e ./test-framework -c portal/profiles/browser/requirements.txt
      - shell: bash
        env:
          # Actions mounts /github/home for pwuser, but this container runs as root.
          # Firefox requires HOME to be owned by the browser process user.
          HOME: /root
        run: |
          python -m http.server 3001 --bind 127.0.0.1 --directory /tmp/lumbre-compat-build >/tmp/lumbre-compat-server.log 2>&1 &
          COMPAT_SERVER_PID=$!
          trap 'kill "$COMPAT_SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3001/ >/dev/null
          python -m pytest -c test-framework/pyproject.toml test-framework/projects/lumbre/tests -m "portal and cross_browser" --browser "$TEST_BROWSER" --output=/tmp/lumbre-compat-artifacts --junitxml=/tmp/lumbre-compat.xml --html=/tmp/lumbre-compat.html --self-contained-html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: browser-compatibility-evidence-${{ matrix.browser }}
          path: |
            /tmp/lumbre-compat-artifacts/
            /tmp/lumbre-compat.xml
            /tmp/lumbre-compat.html
            /tmp/lumbre-compat-server.log
          retention-days: 7
