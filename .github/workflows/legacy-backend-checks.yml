name: Legacy backend checks (not production static)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'portal/package.json'
      - 'portal/package-lock.json'
      - 'portal/server/**'
      - 'portal/app/api/**'
      - '.github/workflows/legacy-backend-checks.yml'

permissions:
  contents: read

jobs:
  legacy-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
        working-directory: portal
      - run: npx tsc --noEmit --incremental false
        working-directory: portal
      - name: Audit legacy dependencies (known braces advisory remains unresolved)
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
        working-directory: portal
