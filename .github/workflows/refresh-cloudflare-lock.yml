name: Refresh Cloudflare dependency lock
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Resolve patched Cloudflare tooling
        working-directory: portal
        run: npm install --package-lock-only --save-dev --save-exact @cloudflare/vite-plugin@1.62.3 wrangler@4.145.0 --ignore-scripts --registry=https://registry.npmjs.org
      - name: Audit the resolved lock
        working-directory: portal
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloudflare-dependency-lock
          path: |
            portal/package.json
            portal/package-lock.json
          if-no-files-found: error
